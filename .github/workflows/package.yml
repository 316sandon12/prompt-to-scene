name: Portable apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --locked --python 3.11 --group build
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run --group build python tools/package_app.py
      - if: runner.os == 'Windows'
        run: uv run python tools/packaged_smoke.py dist/bin/prompt-to-scene-core.exe
      - if: runner.os != 'Windows'
        run: uv run python tools/packaged_smoke.py dist/bin/prompt-to-scene-core
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$REPOSITORY" || gh release create "$TAG" --repo "$REPOSITORY" --title "Prompt-to-Scene $TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --repo "$REPOSITORY" --clobber

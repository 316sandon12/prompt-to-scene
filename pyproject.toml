[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-to-scene"
version = "0.1.0"
description = "An MCP workflow from AI-authored Blender assets to verified Unity scene instances."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.20,<2"]

[project.urls]
Repository = "https://github.com/316sandon12/prompt-to-scene"
Issues = "https://github.com/316sandon12/prompt-to-scene/issues"

[project.scripts]
prompt-to-scene = "prompt_to_scene.cli:main"
prompt-to-scene-mcp = "prompt_to_scene.server:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_scene"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

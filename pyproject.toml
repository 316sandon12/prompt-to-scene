[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-to-scene"
version = "0.14.0"
description = "An MCP workflow for AI-authored models and game images in Unity and Unreal."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.20,<2",
    "pillow>=11,<13",
]

[project.urls]
Repository = "https://github.com/316sandon12/prompt-to-scene"
Issues = "https://github.com/316sandon12/prompt-to-scene/issues"

[project.scripts]
prompt-to-scene = "prompt_to_scene.cli:main"
prompt-to-scene-mcp = "prompt_to_scene.server:main"
prompt-to-scene-app = "prompt_to_scene.setup:main"

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_to_scene"]

[tool.hatch.build.targets.wheel.force-include]
"unity/Packages/com.prompttoscene.bridge" = "prompt_to_scene/resources/unity/Packages/com.prompttoscene.bridge"
"unreal/PromptToScene" = "prompt_to_scene/resources/unreal/PromptToScene"
"plugins/shared" = "prompt_to_scene/resources/plugins/shared"
"examples/herbalist_potion.py" = "prompt_to_scene/resources/examples/herbalist_potion.py"
"examples/forest_apothecary.py" = "prompt_to_scene/resources/examples/forest_apothecary.py"
"examples/images" = "prompt_to_scene/resources/examples/images"
"docs/images/authoring-chair.png" = "prompt_to_scene/resources/docs/images/authoring-chair.png"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
